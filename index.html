<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zubair Official</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,sans-serif;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#09001f,#21005c,#001b5c);
    overflow:auto;
}

body:before,body:after{
    content:"";
    position:fixed;
    border-radius:50%;
    filter:blur(2px);
    opacity:.35;
}

body:before{
    width:220px;
    height:220px;
    background:#7c3aed;
    top:-70px;
    left:-60px;
}

body:after{
    width:250px;
    height:250px;
    background:#2563eb;
    bottom:-90px;
    right:-70px;
}

.card{
    position:relative;
    width:92%;
    max-width:430px;
    margin:25px 0;
    padding:32px 24px;
    text-align:center;
    border-radius:30px;
    background:rgba(15,10,45,.78);
    border:1px solid rgba(255,255,255,.15);
    box-shadow:0 0 45px rgba(98,0,255,.35);
    backdrop-filter:blur(14px);
}

.menu{
    position:absolute;
    top:18px;
    right:20px;
    font-size:28px;
}

.profile{
    width:145px;
    height:145px;
    object-fit:cover;
    border-radius:50%;
    border:5px solid white;
    box-shadow:0 0 30px #8b5cf6;
}

h1{
    margin:20px 0 8px;
    font-size:38px;
    background:linear-gradient(90deg,#fff,#a78bfa,#60a5fa);
    -webkit-background-clip:text;
    color:transparent;
}

.welcome{
    font-size:19px;
    color:#ddd6fe;
}

.social{
    margin:25px 0 10px;
}

.social a{
    display:inline-block;
    margin:5px;
    padding:11px 17px;
    border-radius:25px;
    color:white;
    text-decoration:none;
    background:rgba(255,255,255,.10);
    border:1px solid rgba(255,255,255,.15);
    transition:.3s;
}

.social a:hover{
    transform:translateY(-4px);
    box-shadow:0 0 18px #6366f1;
}

button{
    margin:18px 0;
    padding:14px 32px;
    border:0;
    border-radius:30px;
    font-size:18px;
    font-weight:bold;
    color:white;
    background:linear-gradient(90deg,#7c3aed,#2563eb);
    box-shadow:0 0 25px rgba(99,102,241,.5);
}

.skills{
    margin-top:15px;
}

.skills h2{
    font-size:25px;
}

.skill{
    display:inline-block;
    margin:5px;
    padding:10px 14px;
    border-radius:20px;
    background:rgba(255,255,255,.09);
}

.thanks{
    margin-top:22px;
    color:#c4b5fd;
}
</style>
</head>

<body>

<div class="card">

    <div class="menu">☰</div>

    <img src="profile.jpg" class="profile">

    <h1>Zubair Official</h1>

    <div class="welcome">
        Welcome to my website 🚀
    </div>

    <div class="social">

        <a href="https://www.facebook.com/share/19LbDG8sTy/" target="_blank">
            Facebook
        </a>

        <a href="https://www.instagram.com/" target="_blank">
            Instagram
        </a>

        <a href="https://wa.me/923283831689" target="_blank">
            WhatsApp
        </a>

    </div>

    <button onclick="alert('Hello Zubair Ahmed! 👋')">
        Click Me
    </button>

    <div class="skills">
        <h2>My Skills</h2>

        <span class="skill">📱 Mobile Development</span>
        <span class="skill">💻 Web Development</span>
    </div>

    <div class="thanks">
        Thanks for visiting ❤️
    </div>

</div>

</body>
</html>
